name: NexusGateway
version: '${version}'

main: org.luminolcraft.nexusGateway.Main
api-version: '26.2'
load: POSTWORLD
folia-supported: true

authors: [ NatJerry ]

commands:
  NexusGateway: # 命令的基本名，请不要使用奇怪的字符！
    aliases: # 别名，方便玩家使用
      - "ng"
    usage: "/nexusgateway reload 重载 NexusGateway 配置文件." # 用法
    description: "重载 NexusGateway 配置文件" # 描述
    permission: "nexusgateway.usage" # 需要的权限，通常不用
    permission-message: "你没有管理员权限！" # 无权限返回的消息，通常不用


permissions:
  nexusgateway.usage:
    default: op